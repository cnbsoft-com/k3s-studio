services:
  postgres:
    image: postgres:17
    container_name: mpk3s-postgres
#    restart: unless-stopped
    environment:
      POSTGRES_DB: mpk3s
      POSTGRES_USER: mpk3s
      POSTGRES_PASSWORD: mpk3s
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpk3s -d mpk3s"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
