spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mpk3s}
    username: ${DB_USERNAME:mpk3s}
    password: ${DB_PASSWORD:mpk3s}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false